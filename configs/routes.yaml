# Which adapter answers which question type, and how.
#
# One base model is loaded once; each category swaps in its own LoRA adapter.
# `adapter: null` (or an adapter the backend doesn't have yet) uses the base model,
# so this config works before any adapter is trained.

backend:
  kind: openai                 # openai | peft | echo
  base_url: http://localhost:8000/v1
  base_model: base             # served model name (vLLM) or HF id / path (peft)
  adapter_mode: model_name     # model_name (vLLM) | llamacpp
  vision: false                # true for a vision-language base: the exam's PNGs are sent as images
  # llamacpp_lora_ids: {closed_choice: 0, true_false: 1, ...}
  # For kind: peft, list adapter dirs:
  # adapters: {closed_choice: adapters/closed_choice, essay: adapters/essay}

classifier:
  min_score: 1.0      # rule score below this -> base model
  min_margin: 0.5     # top score must beat runner-up by this -> else base model
  llm_fallback: false # ask the base model for a label when the rules are unsure

# votes: N answers the closed types N times (greedy + N-1 samples at vote_temperature)
# and keeps the majority; ties go to the greedy answer. Not used in raw mode.
routes:
  closed_choice:   {adapter: closed_choice,   max_tokens: 16,   temperature: 0.0, votes: 5}
  true_false:      {adapter: true_false,      max_tokens: 48,   temperature: 0.0, votes: 5}
  matching:        {adapter: matching,        max_tokens: 64,   temperature: 0.0}   # free text: votes never agree
  chronology:      {adapter: chronology,      max_tokens: 32,   temperature: 0.0}
  source_analysis: {adapter: source_analysis, max_tokens: 256,  temperature: 0.0}
  short_open:      {adapter: short_open,      max_tokens: 192,  temperature: 0.0}
  essay:           {adapter: essay,           max_tokens: 2000, temperature: 0.3}
  general:         {adapter: general,         max_tokens: 512,  temperature: 0.0}   # base model when no 'general' adapter is loaded

# Offline retrieval (modes "rag" and "adapters"): BM25 over a local knowledge base
# built by scripts/build_kb.py (.jsonl, BM25 in memory) or an SQLite FTS5 file
# (.sqlite, table passages(title, text)) for all of Wikipedia. Missing file = no RAG. `categories` limits it to
# some question types (omit for all).
rag:
  path: data/kb/passages.jsonl
  k: 4
  max_chars: 3000
