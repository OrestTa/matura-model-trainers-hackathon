# Per-subtype setups for `--mode subtype` (matura_router/subtypes.py), chosen on the dev
# papers (not the held-out May 2023-2026) by scripts/subtype_select.py from the
# configs/subtype_grid.yaml sweep in sweep dev-all, sweep dev-z4, sweep dev-w2, margin 1.0 pts.
subtypes:
  # Orest 22:33 CEST: no OCR (the model sees the images); retry blanks (THINK_FALLBACK=1); closed
  # questions get 5 samples with a majority vote (3 of 5 per key / statement, greedy answer on ties).
  # Everything else is the exact --mode raw request, so it matches the frozen baseline item for item.
  closed_text:
    name: v5
    votes: 5
  closed_image:
    name: v5
    votes: 5
  open_text:
    name: raw
    raw: true
  open_image:
    name: raw
    raw: true
  essay:
    # Blind essay grid on the 12 dev essays (results/judged/essay-grid/README.md, 85a5e51): the plan
    # prompt beat the raw essay by +5/150 in both grading batches; the 350-word length guard lost (-7 and -2).
    # With ESSAY_BEST_OF=3 in the env (3 essays, keep the best one over 300 words) it was +9/150.
    name: plan
    think_tokens: 16384
    max_tokens: 2600
    prompt_suffix: "Zanim zaczniesz, ułóż w myślach plan. Wypracowanie: wstęp z tezą, 3–4 akapity argumentacyjne z konkretnymi datami, postaciami i wydarzeniami z omawianego okresu, kontekst epoki, podsumowanie. 500–700 słów."
