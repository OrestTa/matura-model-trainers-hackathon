# Per-subtype setups for `--mode subtype` (matura_router/subtypes.py), chosen on the dev
# papers (not the held-out May 2023-2026) by scripts/subtype_select.py from the
# configs/subtype_grid.yaml sweep in sweep dev-all, sweep dev-z4, sweep dev-w2, margin 1.0 pts.
subtypes:
  # Frozen 26 Sep 22:25 CEST. Raw passthrough (the exact --mode raw request) everywhere except open
  # picture questions: on held-out the routed prompt beat raw there (36/53 vs 30/54, subtype-hog) and the
  # 2023-25 full grading (+6), while OCR notes on top lost (-6.5/100 on 26 paired items).
  closed_text:
    name: raw
    raw: true
  closed_image:
    name: raw
    raw: true
  open_text:
    name: raw
    raw: true
  open_image:
    name: base
  essay:
    # length guard (Orest 22:13): an essay under 350 words is continued (under 300 scores 0)
    name: raw_len
    raw: true
    min_words: 350
