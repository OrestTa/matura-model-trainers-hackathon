# Per-subtype setups for `--mode subtype` (matura_router/subtypes.py), chosen on the dev
# papers (not the held-out May 2023-2026) by scripts/subtype_select.py from the
# configs/subtype_grid.yaml sweep in sweep dev-all, sweep dev-z4, sweep dev-w2, margin 1.0 pts.
subtypes:
  # Orest 22:33 CEST: no OCR (the model sees the images); retry blanks (THINK_FALLBACK=1); closed
  # questions get 5 samples with a majority vote (3 of 5 per key / statement, greedy answer on ties).
  # Everything else is the exact --mode raw request, so it matches the frozen baseline item for item.
  closed_text:
    name: v5
    votes: 5
  closed_image:
    name: v5
    votes: 5
  open_text:
    name: raw
    raw: true
  open_image:
    name: raw
    raw: true
  essay:
    # length guard (Orest 22:13): an essay under 350 words is continued (under 300 scores 0)
    name: raw_len
    raw: true
    min_words: 350
