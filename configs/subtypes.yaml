# Per-subtype setups for `--mode subtype` (matura_router/subtypes.py), chosen on the dev
# papers (not the held-out May 2023-2026) by scripts/subtype_select.py from the
# configs/subtype_grid.yaml sweep in sweep dev-all, sweep dev-z4, sweep dev-w2, margin 1.0 pts.
subtypes:
  closed_text:
    name: base
    votes: 1
  closed_image:
    name: base
    votes: 1
  open_text:
    name: base
  open_image:
    name: ocr
    ocr: true
  essay:
    # Length guard (Orest, 22:13 CEST): aim at ~400 words; under 350 the model continues the essay
    # (an essay under 300 words scores 0; the base wrote 296-369). Format-only wording, no klucz text.
    name: base_len
    think_tokens: 16384
    min_words: 350
    prompt_suffix: "Zacznij od numeru wybranego tematu (Temat nr X). Celuj w około 400 słów: wstęp z tezą, co najmniej trzy argumenty poparte faktami, datami i postaciami, kontrargument lub ocenę oraz zakończenie z wnioskiem. Pisz tylko na wybrany temat."
