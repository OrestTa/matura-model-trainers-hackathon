# Candidate base models for baselines. Each entry is served by vLLM on its own GPU.
#
# Size limits (Orest, from the organisers, 2026-09-26 12:29 UTC): the base model's weights
# on disk at most base_limit_gb, the fine-tuned model (base + all adapters, or a merged
# model) at most tuned_limit_gb. The 11-12B models must ship pre-quantized: scripts/quantize_checkpoint.py
# writes a 4-bit NF4 checkpoint to work/checkpoints/<key>, and run_baselines.py
# serves that checkpoint instead of the HF weights once it exists. Until then vLLM
# quantizes the HF weights to the same 4-bit NF4 at load time (`quantization`).
# `disk_gb` estimates the shipped 4-bit NF4 form: linear layers at ~0.56 bytes/param
# (NF4 + fp32 block scales), embeddings and lm_head kept in bf16. The measured size from
# quantize_checkpoint.py wins. MODELS=all skips entries over base_limit_gb.
# Entries with a `-bf16` key are full-precision references, to see what quantization costs.
#
# Gated models (Gemma) need HF_TOKEN in the environment.

