# Candidate base models for baselines. Each entry is served by vLLM on its own GPU.
#
# Size limits (Orest, from the organisers, 2026-09-26 12:29 UTC): the base model's weights
# on disk at most ship_limit_gb, the fine-tuned model (base + all adapters, or a merged
# model) at most finetuned_limit_gb. The 11-12B models must ship pre-quantized: scripts/quantize_checkpoint.py
# writes a 4-bit NF4 checkpoint to work/checkpoints/<key>, and run_baselines.py
# serves that checkpoint instead of the HF weights once it exists. Until then vLLM
# quantizes the HF weights to the same 4-bit NF4 at load time (`quantization`).
# `disk_gb` estimates the shipped 4-bit NF4 form: linear layers at ~0.56 bytes/param
# (NF4 + fp32 block scales), embeddings and lm_head kept in bf16. The measured size from
# quantize_checkpoint.py wins. MODELS=all skips entries over ship_limit_gb.
# Entries with a `-bf16` key are full-precision references, to see what quantization costs.
#
# Gated models (Gemma) need HF_TOKEN in the environment.

# Organisers (via Orest, 2026-09-26 12:29 UTC): the base model before fine-tuning at most
# 8.0 GB on disk; the fine-tuned model as shipped (weights + adapters) at most 8.8 GB.
ship_limit_gb: 8.0
finetuned_limit_gb: 8.8

models:
  # 11.2B: 0.26B bf16 embeddings (0.5 GB) + 10.9B NF4 (6.2 GB). Leaves ~2.1 GB for adapters.
  bielik-11b:
    hf_id: speakleash/Bielik-11B-v2.3-Instruct
    params_b: 11.2
    quantization: bitsandbytes
    disk_gb: 6.7
  # Bielik-11B v3.0 (speakleash, Nov 2025), the successor of v2.3: speakleash's own AWQ W4A16
  # checkpoint, 6.19 GB on disk (HF API, measured), not gated, loads natively in vLLM
  # (compressed-tensors, no --quantization flag). Leaves 2.6 GB for adapters under 8.8 GB.
  bielik-11b-v3:
    vision: false
    hf_id: speakleash/Bielik-11B-v3.0-Instruct-awq
    train_hf_id: speakleash/Bielik-11B-v3.0-Instruct   # bf16, gated (auto-approve): needs HF_TOKEN
    params_b: 11.2
    disk_gb: 6.19
  # Gemma 4 12B, Google's quantization-aware-trained Q4_0 GGUF: 6.98 GB (+0.18 GB mmproj if we
  # ever send pictures). Served by llama.cpp (infra/jobs/common.sh ensure_llama_server); Google's
  # vLLM-native w4a16 checkpoint is 10.3 GB because the 262k-vocab embedding stays bf16.
  gemma4-12b:
    hf_id: google/gemma-4-12B-it-qat-q4_0-gguf
    gguf_file: gemma-4-12b-it-qat-q4_0.gguf
    mmproj_file: mmproj-gemma-4-12b-it-qat-q4_0.gguf
    vision: true      # the exam sends PNGs; eval rows carry them with fetch_matura.py --images
    server: llamacpp
    params_b: 12.0
    disk_gb: 7.16     # 6.98 model + 0.18 mmproj
    gpu_gb: 14
  # The same Gemma 4 with its thinking mode on (chat template kwarg), 2000 extra tokens per answer.
  gemma4-12b-think:
    hf_id: google/gemma-4-12B-it-qat-q4_0-gguf
    gguf_file: gemma-4-12b-it-qat-q4_0.gguf
    mmproj_file: mmproj-gemma-4-12b-it-qat-q4_0.gguf
    vision: true
    server: llamacpp
    params_b: 12.0
    disk_gb: 7.16
    gpu_gb: 16
    think_tokens: 2000
    extra_body: {chat_template_kwargs: {enable_thinking: true}}
  # Qwen3.5 9B (Feb 2026), a vision model: Q5_K_M GGUF 6.58 GB + mmproj-F16 0.92 GB = 7.50 GB
  # (Q6_K + mmproj would be 8.4, over), on llama.cpp.
  qwen3.5-9b:
    hf_id: unsloth/Qwen3.5-9B-GGUF
    gguf_file: Qwen3.5-9B-Q5_K_M.gguf
    mmproj_file: mmproj-F16.gguf
    vision: true
    server: llamacpp
    params_b: 9.0
    disk_gb: 7.50
    gpu_gb: 13
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  # Bielik-11B after continued pretraining on Polish history text (infra/jobs/dapt.sh merges
  # the domain LoRA into it). Path on the Forgehand box; TRAIN_MODELS=bielik-11b-dapt trains
  # the per-type adapters on top of it. Skipped by MODELS=all until it exists.
  bielik-11b-dapt:
    hf_id: /workspace/work/models/bielik-11b-dapt
    params_b: 11.2
    quantization: bitsandbytes
    disk_gb: 6.7
  # Progress category: the PRETRAINED Bielik-11B-v2 (no instruction or chat tuning), the model
  # SpeakLeash built the Instruct versions from. It has no chat template, so every script
  # applies `chat_template` (a neutral plain-text Q/A format ending the answer with </s>) to
  # its tokenizer: the raw baseline and our own SFT use the same format. Ungated.
  bielik-11b-base:
    hf_id: speakleash/Bielik-11B-v2
    params_b: 11.2
    quantization: bitsandbytes
    disk_gb: 6.7
    chat_template: configs/chat_templates/plain_pl.jinja
  # bielik-11b-base after DAPT on Polish history text (dapt.sh DAPT_MODEL=bielik-11b-base).
  bielik-11b-base-dapt:
    hf_id: /workspace/work/models/bielik-11b-base-dapt
    params_b: 11.2
    quantization: bitsandbytes
    disk_gb: 6.7
    chat_template: configs/chat_templates/plain_pl.jinja
  qwen3-8b:
    hf_id: Qwen/Qwen3-8B
    params_b: 8.2
    quantization: bitsandbytes
    disk_gb: 6.4   # untied 151k-token embeddings stay bf16 (2.5 GB) + 6.9B NF4 (3.9 GB)
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  # Over the 8.0 GB base limit: its 262k-token embeddings alone are 2.0 GB in bf16, so
  # 4-bit NF4 lands at ~8.3 GB. Kept for reference; MODELS=all skips it.
  gemma3-12b:
    hf_id: google/gemma-3-12b-it
    params_b: 12.2
    quantization: bitsandbytes
    disk_gb: 8.4
  # Small-model category ("Mały, ale wariat": smallest model scoring >= 35%).
  bielik-4.5b:
    hf_id: speakleash/Bielik-4.5B-v3.0-Instruct
    params_b: 4.6
    quantization: bitsandbytes
    disk_gb: 2.9
  bielik-1.5b:
    hf_id: speakleash/Bielik-1.5B-v3.0-Instruct
    params_b: 1.6
    disk_gb: 3.2
  qwen3-1.7b:
    hf_id: Qwen/Qwen3-1.7B
    params_b: 1.7
    disk_gb: 3.4
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  # Full-precision reference for the strongest candidate.
  bielik-11b-bf16:
    hf_id: speakleash/Bielik-11B-v2.3-Instruct
    params_b: 11.2
    disk_gb: 22.4

vllm:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  extra_args: []
