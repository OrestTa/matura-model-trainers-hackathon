# Candidate setups per subtype for scripts/subtype_sweep.py. Each candidate runs only on the
# items of its subtype; scripts/subtype_select.py picks the best per subtype on the dev papers.
# Thinking is ON by default (8,192-token budget; 169/240 vs 126/240 without on the held-out papers).
# `base` = per-type prompt + thinking, the reference every other candidate must beat.
_suffixes:
  facts: &facts "Podaj konkretne fakty: nazwy, nazwiska, daty. Odwołaj się wprost do treści źródła, jeśli jest."
  look: &look "Najpierw dokładnie przyjrzyj się dołączonej ilustracji (napisy, symbole, daty, postacie), potem odpowiedz."
  essay_plan: &essay_plan "Zanim zaczniesz, ułóż w myślach plan. Wypracowanie: wstęp z tezą, 3–4 akapity argumentacyjne z konkretnymi datami, postaciami i wydarzeniami z omawianego okresu, kontekst epoki, podsumowanie. 500–700 słów."

closed_text:
  base: {votes: 1}
  v3: {votes: 3}
  rag: {votes: 1, rag: true}
  nothink: {think: false}            # the old routed setup (5 votes on choice / P-F)

closed_image:
  base: {votes: 1}
  v3: {votes: 3}
  ocr: {votes: 1, ocr: true}
  look_ocr: {votes: 1, ocr: true, prompt_suffix: *look}
  nothink: {think: false}

open_text:
  base: {}
  rag: {rag: true}
  facts: {prompt_suffix: *facts, max_tokens: 384}
  nothink: {think: false}

open_image:
  base: {}
  ocr: {ocr: true}
  look_ocr: {ocr: true, prompt_suffix: *look}
  rag_ocr: {rag: true, ocr: true}
  nothink: {think: false}

essay:
  base: {think_tokens: 16384}
  plan: {think_tokens: 16384, prompt_suffix: *essay_plan, max_tokens: 2600}
  rag_plan: {think_tokens: 16384, rag: true, prompt_suffix: *essay_plan, max_tokens: 2600}
  t4k: {think_tokens: 4096}
