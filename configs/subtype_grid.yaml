# Candidate setups per subtype for scripts/subtype_sweep.py. Each candidate runs only on the
# items of its subtype; scripts/subtype_select.py picks the best per subtype on the dev papers.
# Thinking is ON by default (8,192-token budget; 169/240 vs 126/240 without on the held-out papers).
# `base` = per-type prompt + thinking, the reference every other candidate must beat.
_suffixes:
  facts: &facts "Podaj konkretne fakty: nazwy, nazwiska, daty. Odwołaj się wprost do treści źródła, jeśli jest."
  look: &look "Najpierw dokładnie przyjrzyj się dołączonej ilustracji (napisy, symbole, daty, postacie), potem odpowiedz."
  describe: &describe "W myślach najpierw opisz dokładnie każdą ilustrację: co przedstawia, napisy, symbole, daty, postacie, epokę. Dopiero potem odpowiedz na polecenie; w odpowiedzi podaj tylko to, czego wymaga polecenie."
  essay_rubric: &essay_rubric "Egzaminator CKE ocenia wypracowanie według kryteriów: (A) jasno sformułowane stanowisko (teza) odnoszące się do tematu; (B) uzasadnienie stanowiska – argumenty dotyczące wszystkich elementów wymienionych w temacie (np. trzech władców, trzech aspektów, trzech wydarzeń), każdy z konkretnymi faktami, datami, postaciami; (C) poprawność rzeczowa – żadnych błędów faktograficznych, lepiej pominąć niepewny fakt niż go podać; (D) szerszy kontekst i związki przyczynowo-skutkowe; (E) wniosek potwierdzający tezę, spójna struktura. Zacznij od linii „Temat nr X”, potem wypracowanie (500–700 słów)."
  essay_plan: &essay_plan "Zanim zaczniesz, ułóż w myślach plan. Wypracowanie: wstęp z tezą, 3–4 akapity argumentacyjne z konkretnymi datami, postaciami i wydarzeniami z omawianego okresu, kontekst epoki, podsumowanie. 500–700 słów."

closed_text:
  base: {votes: 1}
  v3: {votes: 3}
  rag: {votes: 1, rag: true}
  nothink: {think: false}            # the old routed setup (5 votes on choice / P-F)
  v5: {votes: 5}
  t2k: {votes: 1, think_tokens: 2000}  # 2k graded better than 8k overall (77 vs 84 pts, 2023+2024)

closed_image:
  base: {votes: 1}
  v3: {votes: 3}
  ocr: {votes: 1, ocr: true}
  look_ocr: {votes: 1, ocr: true, prompt_suffix: *look}
  nothink: {think: false}
  t2k: {votes: 1, think_tokens: 2000}
  v5: {votes: 5}

open_text:
  base: {}
  rag: {rag: true}
  facts: {prompt_suffix: *facts, max_tokens: 384}
  nothink: {think: false}
  t2k: {think_tokens: 2000}

open_image:
  base: {}
  ocr: {ocr: true}
  look_ocr: {ocr: true, prompt_suffix: *look}
  rag_ocr: {rag: true, ocr: true}
  nothink: {think: false}
  t2k: {think_tokens: 2000}
  describe: {prompt_suffix: *describe}
  describe_ocr: {ocr: true, prompt_suffix: *describe}

essay:
  base: {think_tokens: 16384}
  plan: {think_tokens: 16384, prompt_suffix: *essay_plan, max_tokens: 2600}
  rag_plan: {think_tokens: 16384, rag: true, prompt_suffix: *essay_plan, max_tokens: 2600}
  t4k: {think_tokens: 4096}
  t2k: {think_tokens: 2000}
  rubric: {think_tokens: 16384, prompt_suffix: *essay_rubric, max_tokens: 2600}
  rubric_rag: {think_tokens: 16384, rag: true, prompt_suffix: *essay_rubric, max_tokens: 2600}
